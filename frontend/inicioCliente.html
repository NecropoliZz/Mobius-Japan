<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tp Programacion</title>
    <script src="./js/inicioCliente.js" defer></script>
    <link rel="stylesheet" href="./css/inicioCliente.css">
</head>
<body>
    <header>

        <div class="empresa">

            <img class="aplicacion-logo" src="./assets/img/favicon.jpg" alt="Logo">
            <p class="aplicacion-nombre-empresa">Mobius Japan </p>

        </div>
        
        <div class="desarrolladores">

            <p>David soria </p>
            <p>Alexander Tito</p>

        </div>

        <div class="theme-selector">
            <label for="tema-select">Tema:</label>
            <select class="tema-select" id="tema-select">
                <option value="claro">claro</option>
                <option value="oscuro">oscuro</option>
            </select>
        </div>
        
    </header>

    <main>
        <div class="contenedor-inicio">
            
            <h1 class="titulo"> Bienvenido</h1>

            <form class="formulario" action="./index.html">
                <input id="nombre-usuario" type="text" name="nombre-usuario" placeholder="Escribe tu nombre" required autocomplete="off">
                <input class="btn-enviar" type="submit" value="CONTINUAR" onclick="guardar()">
            </form>

        </div>
    </main>
</body>
</html>
