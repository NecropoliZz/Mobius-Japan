<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/carrito.js" defer></script>
    <link rel="stylesheet" href="css/carrito.css">
    <link rel="shortcut icon" href="assets/img/favicon.jpg" type="image/x-icon">
    <title>
        Carrito - Mobius Japan
    </title>
</head>
<body>
    <header>
        <div class="logo">
            <a class="title" href="index.html">
            <img src="assets/img/favicon.jpg" alt="logo mobius">
            Mobius Japan
            </a>
        </div>
        <nav>
            <ul>
                <li class="nav-links"><a href="index.html">Productos</a></li>
                <li class="nav-links"><a href="carrito.html">Carrito</a></li>
            </ul>
        </nav>
        <div class="theme-selector">
            <label for="tema-select">Tema:</label>
            <select id="tema-select">
                <option value="oscuro">oscuro</option>
                <option value="claro">claro</option>
            </select>
        </div>
    </header>
    <main>
         <section class="carrito">
                <h2 id="titulo-carrito">Carrito de Compras</h2>
                
                    <div class="carrito-descripcion">
                        <div class="carrito-descripcion-item">
                            <p class="carrito-descripcion-titulo">Cantidad Total</p>
                            <p class="carrito-descripcion-numero" id="cantidad-total">0</p>
                        </div>
                        <div class="carrito-descripcion-item">
                            <p class="carrito-descripcion-titulo">Precio Total</p>
                            <p class="carrito-descripcion-numero" id="precio-total">0
                                <span class="moneda">USD</span>
                            </p>
                        </div>

                    </div>
                    <div class = "contenedor-btn-comprar">
                        <button class="btn-comprar">Proceder a Comprar</button>
                    </div>
                
                <div class="carrito-lista">
                    <!-- productos del carrito -->
                </div>
        </section>
    </main>
    <footer><p>Todos los derechos reservados | David Ezequiel Soria, Alexander Tito Araca</p></footer>
</body>
</html>
