<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/ticket.css">
    <script src="./js/ticket.js" defer></script>
    <title>Ticket</title>
</head>
<body>
    <header>
        <div class="empresa">
            <p class="nombre-empresa">Mobius Japan </p>
            <img class="logo" src="./assets/img/favicon.jpg" alt="Logo">
            

        </div>

        </div>
    </header>

    <main>
        <h1 class="titulo">Ticket</h1>
        <section class="contenedor-print">
            
            <h3 class="dato-empresa">Mobius Japan</h3>
            
            <p id="usuario"></p>
            
            <div id="fecha">
                <p id="dia"></p>
                <p id="hora"></p>

            <table id="tabla-compras"> </table>
            
            <p id="precio-final"></p>

        <section class="opciones">
            <button class="btn btn-imprimir">Imprimir</button>
            <button class="btn btn-descargar-excel">Descargar en excel</button>
            <a class="btn btn-salir" href="./inicioCliente.html">Salir</a>
